name: CI

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same image as docker-compose.yml, so CI and local cannot drift on the
        # Postgres major version or on whether pgvector is available.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: tender
          POSTGRES_PASSWORD: tender_ci
          POSTGRES_DB: tender_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tender -d tender_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Migrations need the privileged role: pgvector is not a trusted extension (D018).
      MIGRATION_DATABASE_URL: postgresql://tender:tender_ci@localhost:5432/tender_test
      # Tests connect as the unprivileged role, the same as production will.
      TEST_DATABASE_URL: postgresql://tender_app:tender_ci_app@localhost:5432/tender_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Reads .nvmrc, so local and CI cannot drift apart.
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first because it is what production consumes, so a break there fails
      # before anything else runs. Nothing below depends on it (D019).
      - run: pnpm build

      - run: pnpm typecheck
      - run: pnpm lint

      # Creates the unprivileged app role and its grants, the same script local
      # development uses, so the two setups cannot diverge.
      - name: Create the application role
        env:
          PGPASSWORD: tender_ci
        run: |
          psql -h localhost -U tender -d tender_test -v ON_ERROR_STOP=1 \
            -v app_password=tender_ci_app -f scripts/create-app-role.sql

      - name: Apply migrations
        run: pnpm --filter @tender/db migrate

      - name: Confirm the migration created the extensions
        env:
          PGPASSWORD: tender_ci
        run: |
          psql -h localhost -U tender -d tender_test -tAc \
            "SELECT extname FROM pg_extension WHERE extname IN ('vector','pg_trgm') ORDER BY 1" \
            | tr '\n' ' ' | grep -q 'pg_trgm vector'

      - run: pnpm test
      - run: pnpm format:check
